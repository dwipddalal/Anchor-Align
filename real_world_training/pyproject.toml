[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starvla-realworld-xarm7"
version = "0.1.0"
description = "Portable StarVLA training code for real-world xArm7 mug demonstrations"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["."]
include = ["starVLA*", "deployment*"]
exclude = ["*.__pycache__*"]

[tool.ruff]
line-length = 121
target-version = "py310"

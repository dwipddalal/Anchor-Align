# QwenGR00T baseline trained on real-world xArm7 mug-and-plate demonstrations.
# Task: "Pick up the green mug and place it on the plate."

run_id: qwengr00t_qwen25vl3b_mug_xarm7_hires448_baseline
run_root_dir: ${oc.env:OUTPUT_ROOT}
seed: 42
trackers:
  - jsonl
  - wandb
wandb_entity: ${oc.env:WANDB_ENTITY,null}
wandb_project: ${oc.env:WANDB_PROJECT,starvla-realworld}
is_debug: false

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ${oc.env:BASE_VLM}
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 8
    state_dim: 8
    future_action_window_size: 63
    action_horizon: 64
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 64
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  reduce_in_full_precision: true

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    include_state: true
    lerobot_version: "v3.0"
    dataset_py: lerobot_datasets
    data_root_dir: ${oc.env:DATA_ROOT}
    data_mix: mug_xarm7
    action_type: qpos
    default_image_resolution: [3, 448, 448]
    obs_image_size: [448, 448]
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs:
      - image_0
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 80000
  num_warmup_steps: 13332
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
